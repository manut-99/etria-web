<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Título descriptivo en <title>, que es la fuente principal del resultado
      en Google. El costo es que el tab también lo muestra (recortado).
      Si alguna vez pesa más el tab corto que el título del buscador, acá va
      "Etria" solo: la versión larga ya está en og:title y en el JSON-LD.
    -->
    <title>Etria - Automatizando la orientación de atención médica</title>
    <meta
      name="description"
      content="Etria automatiza la orientación de atención médica: acompaña al afiliado desde la app de su prepaga u obra social y lo orienta hacia la guardia, una teleconsulta o el cuidado en casa. Protocolos clínicos revisados y trazables."
    />
    <meta name="theme-color" content="#061635" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Etria" />
    <meta
      property="og:title"
      content="Etria - Automatizando la orientación de atención médica"
    />
    <meta
      property="og:description"
      content="Orientación clínica embebida para prepagas y obras sociales. Menos guardias evitables, mejor experiencia del afiliado."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Etria - Automatizando la orientación de atención médica"
    />
    <meta
      name="twitter:description"
      content="Orientación clínica embebida para prepagas y obras sociales. Menos guardias evitables, mejor experiencia del afiliado."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Etria",
        "alternateName": "Etria - Automatizando la orientación de atención médica",
        "description": "Orientación clínica embebida para prepagas y obras sociales del sistema de salud argentino.",
        "email": "info@etriahealth.com"
      }
    </script>
    <meta property="og:locale" content="es_AR" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
